services:
  - type: web
    name: joblane-api
    runtime: docker
    plan: free
    region: singapore
    branch: deployment/production
    dockerfilePath: ./Backend_JobPortal/Dockerfile
    dockerContext: ./Backend_JobPortal
    healthCheckPath: /actuator/health
    autoDeployTrigger: off
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
